<style>
/* Groupies. Nocturne palette, three.js example chrome: viewport first, chrome as raw
   overlay, monospace, hard edges, zero border-radius, no cards, grid floor. */
:root{
  --bg:#0A0710;
  --panel:#15101D;
  --panel-hi:#1E1729;
  --row:#191322;
  --line:#2C2036;
  --line-hi:#3D2C4A;
  --txt:#E8DFD0;
  --dim:#8A7A9B;
  --dimmer:#5E5170;
  --accent:#E23A54;
  --gold:#E0A356;
  --live:#7FAE8C;
  --p0:#A886C4; --p1:#CE566F; --p2:#86A4CC; --p3:#DFA95F; --p4:#7FAE8C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--txt);
  font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}

.wrap{position:relative;width:100%;height:100vh;min-height:660px;overflow:hidden;background:var(--bg)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}

/* -- overlay chrome ----------------------------------- */
.ov{position:absolute;z-index:3}

/* top-left: stats readout (stats.js) */
.stats{top:0;left:0;border:1px solid var(--line-hi);background:#0D0914;padding:4px 6px 5px;min-width:132px}
.stats .sv{font-size:10px;letter-spacing:.04em;color:var(--accent);font-weight:700;white-space:nowrap}
.stats canvas{display:block;margin-top:3px;image-rendering:pixelated}

/* top-centre: title, three.js style */
.title{top:12px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
.title b{color:var(--accent);font-weight:700;letter-spacing:.02em}
.title span{color:var(--dim)}
.title .q{
  display:block;margin-top:9px;font-family:Fraunces,Georgia,serif;font-size:21px;
  color:var(--txt);letter-spacing:-.01em;font-weight:400;
}

/* top-right: lil-gui limits rack */
.gui{top:0;right:0;width:268px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.gui .ghead{
  background:#0D0914;padding:6px 9px;font-size:11px;font-weight:700;letter-spacing:.06em;
  color:var(--txt);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;
}
.gui .ghead i{font-style:normal;color:var(--dimmer);font-weight:400}
.fold{border-bottom:1px solid var(--line)}
.fold>.fh{
  background:var(--panel-hi);padding:5px 9px;font-size:11px;font-weight:500;
  display:flex;align-items:center;gap:7px;color:var(--dim);
}
.fold.on>.fh{color:var(--txt)}
.fold>.fh .sw{width:8px;height:8px;flex:none;background:currentColor}
.fold>.fh .who{color:inherit}
.fold>.fh .st{margin-left:auto;font-size:9.5px;letter-spacing:.05em;color:var(--dimmer)}
.fold.killer>.fh .st{color:var(--accent)}
.fold.flexed>.fh .st{color:var(--gold)}

.gr{display:grid;grid-template-columns:74px 1fr;gap:0;align-items:center;background:var(--row);border-top:1px solid #120D1B}
.gr .lb{padding:4px 0 4px 9px;color:var(--dimmer);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .fld{
  margin:3px 9px 3px 0;background:#0E0A16;border:1px solid #2A1F35;padding:2px 6px;
  font-size:10.5px;color:var(--dim);min-height:19px;display:flex;align-items:center;
}
.gr .fld.val{color:var(--txt)}
.gr .fld.hard{color:var(--accent)}
.gr .fld.soft{color:var(--dimmer);border-style:dashed}
.gr .fld.gold{color:var(--gold);border-color:var(--gold)}
.gr .fld.ok{color:var(--live)}
/* lil-gui slider */
.sl{margin:3px 9px 3px 0;display:grid;grid-template-columns:1fr 46px;gap:4px;align-items:center}
.sl .trk{position:relative;height:19px;background:#0E0A16;border:1px solid #2A1F35;overflow:hidden}
.sl .fil{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85;transition:width .9s cubic-bezier(.22,.61,.36,1),background .9s}
.sl.gold .fil{background:var(--gold)}
.sl .num{
  background:#0E0A16;border:1px solid #2A1F35;height:19px;display:flex;align-items:center;
  justify-content:flex-end;padding:0 5px;font-size:10.5px;color:var(--accent);
  font-variant-numeric:tabular-nums;transition:color .9s;
}
.sl.gold .num{color:var(--gold)}
.whisper{padding:1px 9px 6px;color:var(--dimmer);font-size:10px;line-height:1.45;font-style:italic;
  max-height:0;opacity:0;overflow:hidden;transition:max-height .4s,opacity .4s,padding .4s}
.fold.on .whisper{max-height:70px;opacity:1}

/* the flex ask, docked under the rack */
.flex{
  margin-top:-1px;width:268px;border:1px solid var(--gold);border-right:0;background:#1B1410;
  padding:10px;display:none;
}
.flex.on{display:block}
.flex .ft{font-size:9.5px;letter-spacing:.11em;color:var(--gold);margin-bottom:6px}
.flex p{margin:0 0 9px;font-size:11px;line-height:1.5;color:var(--dim)}
.flex p b{color:var(--txt);font-weight:500}
.flex button{
  font-family:inherit;font-size:10.5px;letter-spacing:.07em;padding:6px 12px;
  border:1px solid var(--gold);background:var(--gold);color:#170D03;font-weight:700;cursor:pointer;
}
.flex button:hover{background:#EFB673;border-color:#EFB673}
.flex .no{background:transparent;color:var(--dim);border-color:var(--line-hi);margin-left:5px;font-weight:400}
.flex .no:hover{background:transparent;border-color:var(--dim);color:var(--txt)}

/* verdict slab, replaces the rack */
.verd{width:268px;background:var(--panel);border-left:1px solid var(--live);border-bottom:1px solid var(--line);display:none}
.verd.on{display:block}
.verd .vh{background:#0F1710;padding:8px 9px;border-bottom:1px solid var(--line)}
.verd .vt{font-size:9.5px;letter-spacing:.11em;color:var(--live)}
.verd h2{margin:3px 0 1px;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600;letter-spacing:-.01em}
.verd .vm{font-size:10px;color:var(--dim)}
.verd .worst{padding:8px 9px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--dim);line-height:1.5}
.verd .worst b{color:var(--txt);font-weight:500}
.sigs{padding:8px 9px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sig{width:22px;height:22px;border:1px solid var(--line-hi);background:#0E0A16;display:grid;place-items:center;
  font-size:9.5px;color:var(--dimmer);transition:all .3s}
.sig.in{border-color:currentColor;background:#141E15;color:var(--txt)}

/* bottom-left: Izzy + her plain-text status */
.izzybox{bottom:0;left:12px;display:flex;align-items:flex-end;gap:0}
#izzy{width:292px;flex:none;transition:opacity .4s;margin-bottom:-6px}
#izzy.hidden{opacity:0}
#izzy svg{display:block;width:100%;height:auto;overflow:visible}
.izzymeta{padding:0 0 26px 2px;max-width:230px}
.izzymeta .nm{font-size:9.5px;letter-spacing:.13em;color:var(--dimmer)}
.izzymeta .stt{font-size:11.5px;color:var(--txt);margin-top:3px;line-height:1.4}
.izzymeta .hd{
  margin-top:7px;font-family:inherit;font-size:9.5px;letter-spacing:.07em;color:var(--dimmer);
  background:transparent;border:1px solid var(--line-hi);padding:3px 8px;cursor:pointer;
}
.izzymeta .hd:hover{color:var(--txt);border-color:var(--dim)}

/* bottom-centre: step readout */
.beat{bottom:16px;left:50%;transform:translateX(-50%);text-align:center;max-width:520px;pointer-events:none}
.beat .bk{font-size:10px;letter-spacing:.1em;color:var(--accent)}
.beat .bk s{color:var(--dimmer);text-decoration:none}
.beat .bl{margin-top:5px;font-family:Fraunces,Georgia,serif;font-size:15px;color:var(--txt);line-height:1.35;text-wrap:balance}

/* bottom-right: transport */
.tp{bottom:0;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:0}
.tp .row{display:flex;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--panel)}
.tp button{
  font-family:inherit;font-size:10.5px;letter-spacing:.08em;padding:8px 14px;
  background:transparent;border:0;border-right:1px solid var(--line);color:var(--dim);cursor:pointer;
}
.tp button:last-child{border-right:0}
.tp button:hover:not(:disabled){color:var(--txt);background:var(--panel-hi)}
.tp button:disabled{color:#3A3145;cursor:default}
.tp button.pri{color:var(--accent);font-weight:700}
.ticks{display:flex;border-left:1px solid var(--line);border-top:1px solid var(--line);background:var(--panel)}
.ticks i{width:22px;height:5px;border-right:1px solid var(--bg);background:#241A30;display:block;transition:background .3s}
.ticks i.done{background:var(--dimmer)}
.ticks i.now{background:var(--accent)}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}

@media (max-width:900px){
  .gui,.verd,.flex{width:214px}
  #izzy{width:150px}
  .title .q{font-size:16px}
  #izzy{width:118px}
  .izzymeta{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>

<script>
"use strict";
var DOT=" \u00b7 ", LE="\u2264";

/* -- data -------------------------------------------- */
var PEOPLE=[
 {id:"rio", n:"Rio",  c:"#A886C4", raw:"honestly i don't care. just not italian again lol",
  lim:"not italian", kind:"soft", got:"Mexican", res:"honoured", cost:0},
 {id:"maya",n:"Maya", c:"#CE566F", raw:"i have to be home by 9. that one's not moving",
  lim:"home by 9:00", kind:"hard", got:"home 8:50", res:"10 min spare", cost:0},
 {id:"jess",n:"Jess", c:"#86A4CC", raw:"my feet are killing me, nothing over a 15 min walk",
  lim:"walk "+LE+" 15", kind:"hard", got:"18 min walk", res:"3 min over", cost:3, slider:{min:5,max:30,from:15,to:20}},
 {id:"kai", n:"Kai",  c:"#DFA95F", raw:"anywhere's fine as long as there's something vegan",
  lim:"vegan option", kind:"hard", got:"full vegan menu", res:"honoured", cost:0},
 {id:"sam", n:"Sam",  c:"#7FAE8C", raw:"i'm broke this week. like $20 tops, sorry",
  lim:LE+" $20", kind:"hard", got:"$14 a head", res:"$6 under", cost:0}
];
var OPTS=[
 {id:"sotto", n:"Bar Sotto",    m:"italian"+DOT+"$$$"+DOT+"6 min", kills:[["sam","$34 a head"],["kai","no vegan"]]},
 {id:"noodle",n:"Noodle Bar",   m:"$"+DOT+"vegan"+DOT+"8 min",     kills:[["maya","40 min wait"]]},
 {id:"green", n:"Green Room",   m:"vegan"+DOT+"$$"+DOT+"22 min",   kills:[["jess","22 min walk"]]},
 {id:"luz",   n:"Taqueria Luz", m:"$"+DOT+"vegan"+DOT+"18 min",    kills:[["jess","18 min walk"]]}
];
var WIN=OPTS[3];

/* Izzy's plain-text status. Codex rule: never encode critical state only in her pose. */
var STEPS=[
 {k:"00",t:"room",     l:"Five people, one question, and nobody has said the real thing yet.",
  st:"lost",   sx:"listening for limits",              tail:"/ five people, one call"},
 {k:"01",t:"intake",   l:"Everyone types privately. Nobody sees anyone else's.",
  st:"lost",   sx:"listening for limits",              tail:"/ 5 of 5 submitted, privately"},
 {k:"02",t:"limits",   l:"The model pulls the real limits out of what they said. Four hard, one soft.",
  st:"anchor", sx:"four paths open",                   tail:"/ 4 hard, 1 soft"},
 {k:"03",t:"ruled out",l:"Nothing is voted down. Each option dies on a named person's stated limit.",
  st:"anchor", sx:"ruling out by stated limit",        tail:"/ ruling out"},
 {k:"04",t:"deadlock", l:"Zero survivors. Not a failure, a contradiction the group can now see.",
  st:"lost",   sx:"no path remains yet",               tail:"/ 0 survivors"},
 {k:"05",t:"flex",     l:"The smallest flex that reopens the most, asked of one person only.",
  st:"anchor", sx:"one small flex could reopen a path",tail:"/ searching for the smallest flex"},
 {k:"06",t:"verdict",  l:"Taqueria Luz. Jess pays three minutes, and every alternative had someone worse off.",
  st:"anchor", sx:"a path remains, waiting for 5 signatures", tail:"/ 1 path"},
 {k:"07",t:"unanimous",l:"Every groupie signed. Five of five, not three of five.",
  st:"empowered", sx:"unanimous",                      tail:"/ signed"}
];

/* -- tiny hand-rolled 3D. No library, fully self-contained. -- */
var cv=document.getElementById("view"), ctx=cv.getContext("2d");
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);

var yaw=0.6, pitch=0.40, dist=10.0, focal=880;
var mx=0,my=0,tmx=0,tmy=0;
document.getElementById("wrap").addEventListener("mousemove",function(e){
  var r=cv.getBoundingClientRect();
  tmx=((e.clientX-r.left)/r.width-.5)*2; tmy=((e.clientY-r.top)/r.height-.5)*2;
});

function proj(p){
  var cy=Math.cos(yaw), sy=Math.sin(yaw);
  var x=p.x*cy-p.z*sy, z=p.x*sy+p.z*cy, y=p.y;
  var cp=Math.cos(pitch), sp=Math.sin(pitch);
  var y2=y*cp-z*sp, z2=y*sp+z*cp+dist;
  if(z2<.25) z2=.25;
  var f=focal/z2;
  return {x:W*0.42+x*f, y:H/2-y2*f+H*.13, z:z2, s:f};
}
function fog(z){var t=(z-6)/16; if(t<0)t=0; if(t>1)t=1; return 1-t*.88;}

var R_P=4.3, R_O=2.75;
var O_Y=[2.30,1.72,2.08,3.05];
function ppos(i){var a=(-90+i*72)*Math.PI/180; return {x:R_P*Math.cos(a), y:1.15, z:R_P*Math.sin(a)};}
function opos(i){var a=(-90+i*90+45)*Math.PI/180; return {x:R_O*Math.cos(a), y:O_Y[i], z:R_O*Math.sin(a)};}

/* per-option animation state: 0 = aloft, 1 = fallen to the floor */
var fallAmt=[0,0,0,0], fallTarget=[0,0,0,0], aliveIdx=-1;
var bloomOpen=0, bloomTarget=0, signAmt=0, signTarget=0, dimAmt=0, dimTarget=0, focusJess=0, focusTarget=0;

function drawGrid(){
  var G=7, STEPN=14, i, a, p1, p2;
  ctx.lineWidth=1;
  for(i=0;i<=STEPN;i++){
    a=-G+(2*G)*i/STEPN;
    p1=proj({x:a,y:0,z:-G}); p2=proj({x:a,y:0,z:G});
    ctx.strokeStyle="rgba(126,102,158,"+(0.24*fog((p1.z+p2.z)/2)).toFixed(3)+")";
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    p1=proj({x:-G,y:0,z:a}); p2=proj({x:G,y:0,z:a});
    ctx.strokeStyle="rgba(126,102,158,"+(0.24*fog((p1.z+p2.z)/2)).toFixed(3)+")";
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
}

/* soft light pool cast on the floor directly under a point: sells the height */
function floorPool(wp,col,rad,alpha){
  var f0=proj({x:wp.x,y:0,z:wp.z});
  var rr=rad*f0.s;
  var g=ctx.createRadialGradient(f0.x,f0.y,0,f0.x,f0.y,rr);
  g.addColorStop(0,hexA(col,alpha*fog(f0.z)));
  g.addColorStop(1,hexA(col,0));
  ctx.save(); ctx.translate(f0.x,f0.y); ctx.scale(1,0.34); ctx.translate(-f0.x,-f0.y);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f0.x,f0.y,rr,0,6.284); ctx.fill(); ctx.restore();
}

function hexA(h,a){
  var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}

function drawBloom(p,col,scale,openAmt,glow,label,sub,litLabel){
  var s=p.s, r=0.24*s*scale, i, a, px, py;
  ctx.save();
  if(glow>0){
    var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4.2);
    g.addColorStop(0,hexA(col,.34*glow)); g.addColorStop(1,hexA(col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r*4.2,0,6.284); ctx.fill();
  }
  for(i=0;i<6;i++){
    a=i*Math.PI/3;
    px=p.x+r*.82*Math.cos(a)*(.35+.65*openAmt);
    py=p.y+r*.82*Math.sin(a)*(.35+.65*openAmt);
    ctx.fillStyle=hexA(col,(.45+.5*openAmt)*fog(p.z));
    ctx.beginPath(); ctx.ellipse(px,py,r*.7,r*.5,a,0,6.284); ctx.fill();
  }
  ctx.fillStyle=hexA(litLabel?"#E0A356":"#2B1A22",.95);
  ctx.beginPath(); ctx.arc(p.x,p.y,r*.42,0,6.284); ctx.fill();
  if(label){
    ctx.textAlign="center";
    ctx.font="500 "+Math.max(10,Math.round(0.21*s))+"px 'JetBrains Mono',monospace";
    ctx.fillStyle=hexA("#E8DFD0",(openAmt>.4?.92:.5)*fog(p.z));
    ctx.fillText(label,p.x,p.y+r*2.5);
    if(sub){
      ctx.font="400 "+Math.max(8,Math.round(0.175*s))+"px 'JetBrains Mono',monospace";
      ctx.fillStyle=hexA("#8A7A9B",.8*openAmt*fog(p.z));
      ctx.fillText(sub,p.x,p.y+r*2.5+Math.max(11,0.21*s));
    }
  }
  ctx.restore();
}

function frame(){
  mx+=(tmx-mx)*.05; my+=(tmy-my)*.05;
  yaw+=0.0014;
  var vyaw=yaw+mx*0.10, vpitch=pitch-my*0.055;
  var _y=yaw,_p=pitch; yaw=vyaw; pitch=Math.max(.16,Math.min(.72,vpitch));

  var i;
  for(i=0;i<4;i++) fallAmt[i]+=(fallTarget[i]-fallAmt[i])*.055;
  bloomOpen+=(bloomTarget-bloomOpen)*.06;
  signAmt+=(signTarget-signAmt)*.06;
  dimAmt+=(dimTarget-dimAmt)*.07;
  focusJess+=(focusTarget-focusJess)*.07;

  ctx.clearRect(0,0,W,H);
  var bg=ctx.createRadialGradient(W/2,H*.42,0,W/2,H*.42,Math.max(W,H)*.78);
  bg.addColorStop(0,"#1A1026"); bg.addColorStop(.55,"#0D0814"); bg.addColorStop(1,"#08050D");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawGrid();

  /* floor pools first, so everything else sits above them */
  PEOPLE.forEach(function(pe,pi){
    var pp=ppos(pi);
    floorPool(pp,pe.c,0.72,(0.10+0.20*bloomOpen)*(pe.id==="jess"?(1-dimAmt*.1):(1-dimAmt*.8)));
  });
  OPTS.forEach(function(o,oi){
    var op=opos(oi);
    floorPool(op,oi===aliveIdx?"#7FAE8C":"#7A6890",0.58,(oi===aliveIdx?0.26:0.10)*bloomOpen*(1-dimAmt*.8));
  });

  var items=[];

  /* branches */
  OPTS.forEach(function(o,oi){
    var op=opos(oi), fa=fallAmt[oi];
    var ov={x:op.x,y:op.y*(1-fa)+0.06*fa,z:op.z};
    PEOPLE.forEach(function(pe,pi){
      var pp=ppos(pi);
      var killed=o.kills.filter(function(k){return k[0]===pe.id;}).length>0;
      var pts=[],t,q;
      for(t=0;t<=1.0001;t+=1/16){
        var cxp=(ov.x+pp.x)/2, cyp=Math.max(ov.y,pp.y)+1.5-1.4*fa, czp=(ov.z+pp.z)/2;
        q={x:(1-t)*(1-t)*ov.x+2*(1-t)*t*cxp+t*t*pp.x,
           y:(1-t)*(1-t)*ov.y+2*(1-t)*t*cyp+t*t*pp.y,
           z:(1-t)*(1-t)*ov.z+2*(1-t)*t*czp+t*t*pp.z};
        pts.push(proj(q));
      }
      var zavg=0; pts.forEach(function(p){zavg+=p.z;}); zavg/=pts.length;
      items.push({z:zavg,draw:function(){
        var alive=(oi===aliveIdx);
        var base=killed?"#E23A54":(alive?"#7FAE8C":"#7A6890");
        var al=(killed?.85:(alive?.9:.4))*(1-fa)*fog(zavg)*(1-dimAmt*.85)*bloomOpen;
        if(al<=.01)return;
        ctx.strokeStyle=hexA(base,al);
        ctx.lineWidth=(alive?2:killed?1.7:1.1);
        if(killed) ctx.setLineDash([4,7]); else ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
        for(var k=1;k<pts.length;k++) ctx.lineTo(pts[k].x,pts[k].y);
        ctx.stroke(); ctx.setLineDash([]);
      }});
    });
  });

  /* option buds */
  OPTS.forEach(function(o,oi){
    var op=opos(oi), fa=fallAmt[oi];
    var y=op.y*(1-fa)+0.07*fa;
    var p=proj({x:op.x,y:y,z:op.z});
    var alive=(oi===aliveIdx);
    items.push({z:p.z,draw:function(){
      var s=p.s, r=0.20*s;
      var al=fog(p.z)*(1-dimAmt*.86)*bloomOpen*(fa>.98?.55:1);
      if(al<=.01)return;
      ctx.save();
      if(alive){
        var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);
        g.addColorStop(0,hexA("#7FAE8C",.3)); g.addColorStop(1,hexA("#7FAE8C",0));
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r*4,0,6.284); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.284);
      ctx.fillStyle=hexA(alive?"#22331E":"#1F1429",al);
      ctx.fill();
      ctx.strokeStyle=hexA(alive?"#7FAE8C":(fa>.5?"#3A2A44":"#4A3757"),al);
      ctx.lineWidth=alive?2:1.2; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x,p.y,r*.34,0,6.284);
      ctx.fillStyle=hexA(alive?"#7FAE8C":"#4A3550",al); ctx.fill();

      ctx.textAlign="center";
      ctx.font="700 "+Math.max(10,Math.round(0.215*s))+"px 'JetBrains Mono',monospace";
      ctx.fillStyle=hexA(alive?"#CFE6C8":"#E8DFD0",al*(fa>.5?.5:1));
      ctx.fillText(o.n,p.x,p.y-r*1.9);
      ctx.font="400 "+Math.max(8,Math.round(0.175*s))+"px 'JetBrains Mono',monospace";
      ctx.fillStyle=hexA("#8A7A9B",al*.85*(fa>.5?.45:1));
      ctx.fillText(o.m,p.x,p.y-r*1.9-Math.max(11,0.21*s));

      if(fa>.55){
        var lbl=o.kills.map(function(k){
          return PEOPLE.filter(function(q){return q.id===k[0];})[0].n+DOT+k[1];
        }).join("  +  ");
        ctx.font="400 "+Math.max(8,Math.round(0.165*s))+"px 'JetBrains Mono',monospace";
        var tw=ctx.measureText(lbl).width;
        ctx.fillStyle=hexA("#2A0F19",(fa-.55)/.45*al);
        ctx.fillRect(p.x-tw/2-6,p.y+r*1.5,tw+12,16);
        ctx.strokeStyle=hexA("#8E1F3D",(fa-.55)/.45*al); ctx.lineWidth=1;
        ctx.strokeRect(p.x-tw/2-6,p.y+r*1.5,tw+12,16);
        ctx.fillStyle=hexA("#F0A8B4",(fa-.55)/.45*al);
        ctx.fillText(lbl,p.x,p.y+r*1.5+11);
      }
      ctx.restore();
    }});
  });

  /* groupie blooms */
  PEOPLE.forEach(function(pe,pi){
    var pp=ppos(pi);
    var isJ=(pe.id==="jess");
    var bob=Math.sin(Date.now()/1000*.55+pi*1.7)*.075;
    var p=proj({x:pp.x,y:pp.y+bob,z:pp.z});
    items.push({z:p.z,draw:function(){
      var d=isJ?(1-dimAmt*.15):(1-dimAmt*.88);
      var pulse=isJ?(1+focusJess*.16*Math.sin(Date.now()/1000*4)):1;
      ctx.globalAlpha=d;
      drawBloom(p,pe.c,pulse*(1+signAmt*.13),bloomOpen,(0.45+signAmt*.5+focusJess*.5),
                pe.n, bloomOpen>.5?pe.lim:"", signAmt>.5);
      ctx.globalAlpha=1;
    }});
  });

  items.sort(function(a,b){return b.z-a.z;});
  items.forEach(function(it){it.draw();});

  yaw=_y; pitch=_p;
  requestAnimationFrame(frame);
}

var IZZY_CSS = `
#izzy,.izzy{display:block}
#izzy svg,.izzy svg{width:100%;height:auto;overflow:visible}

/* transform anchors. Without these every rotation pivots on the wrong point. */
.izzy .stage   {transform-box:fill-box;transform-origin:50% 62%}
.izzy .figure  {transform-box:fill-box;transform-origin:50% 100%}
.izzy .head    {transform-box:fill-box;transform-origin:50% 92%}
.izzy .veil    {transform-box:fill-box;transform-origin:50% 60%}

.izzy .armR   {transform-origin:38% 6%}
.izzy .legL,.izzy .legR{transform-box:fill-box;transform-origin:50% 2%}
.izzy .hairBack{transform-box:fill-box;transform-origin:50% 4%}
.izzy .rose    {transform-box:fill-box;transform-origin:center}

/* ---- idle: independent periods so nothing visibly loops together ---- */
.izzy .figure  {animation:iz-breathe 4.8s ease-in-out infinite}
.izzy .hairBack{animation:iz-hair 7.3s ease-in-out infinite}
.izzy .veil    {animation:iz-veil 6.1s ease-in-out infinite}
.izzy .moth    {animation:iz-flit 9.7s ease-in-out infinite}
.izzy .shadow  {animation:iz-shadow 4.8s ease-in-out infinite}
@keyframes iz-breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.012)}}
@keyframes iz-hair{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
@keyframes iz-veil{0%,100%{transform:scale(1) rotate(-.5deg)}50%{transform:scale(1.018) rotate(.5deg)}}
@keyframes iz-shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.97);opacity:.9}}
@keyframes iz-flit{
  0%,100%{transform:translate(126px,34px) rotate(0)}
  28%{transform:translate(138px,20px) rotate(-10deg)}
  61%{transform:translate(112px,14px) rotate(8deg)}
}

/* ---- smile, cross-faded on the permitted lower face ---- */
.izzy .mouthSmile{opacity:0;transition:opacity .32s ease}
.izzy .mouthRest {opacity:1;transition:opacity .32s ease}
.izzy .blush{opacity:.55;transition:opacity .5s ease}
.izzy[data-smile="1"] .mouthSmile{opacity:1}
.izzy[data-smile="1"] .mouthRest {opacity:0}
.izzy[data-smile="1"] .blush{opacity:1}

/* ---- persistent states ---- */
.izzy .head,.izzy .armL,.izzy .armR,.izzy .legL,.izzy .legR,.izzy .redrose,.izzy .halo,.izzy .aura{
  transition:transform 1.1s cubic-bezier(.22,.61,.36,1),opacity 1.1s}
.izzy[data-state=lost] .head{transform:rotate(-8deg) translateY(2px)}
.izzy[data-state=lost] .armL{transform:rotate(8deg)}
.izzy[data-state=lost] .armR{transform:rotate(-8deg)}
.izzy[data-state=lost] .redrose{opacity:.5}
.izzy[data-state=lost] .halo{opacity:.06}
.izzy[data-state=lost] .aura{opacity:.04}
.izzy[data-state=anchor] .head{transform:rotate(-1.5deg)}

.izzy[data-state=empowered] .halo{opacity:.6}
.izzy[data-state=empowered] .aura{opacity:.5}

/* ---- playful actions. Each overrides idle on the part it drives. ---- */

/* BACKFLIP: the whole stage rotates once; hair and veil lag behind the body. */
.izzy[data-act=backflip] .stage{animation:iz-flip 1.15s cubic-bezier(.3,.05,.25,1)}
.izzy[data-act=backflip] .hairBack{animation:iz-flip-hair 1.15s cubic-bezier(.3,.05,.25,1)}
.izzy[data-act=backflip] .legL{animation:iz-flip-legL 1.15s ease-in-out}
.izzy[data-act=backflip] .legR{animation:iz-flip-legR 1.15s ease-in-out}
.izzy[data-act=backflip] .armL{animation:iz-flip-armL 1.15s ease-in-out}
.izzy[data-act=backflip] .armR{animation:iz-flip-armR 1.15s ease-in-out}
.izzy[data-act=backflip] .shadow{animation:iz-flip-shadow 1.15s ease-in-out}
@keyframes iz-flip{
  0%{transform:translateY(0) rotate(0) scale(1)}
  12%{transform:translateY(6px) rotate(-6deg) scale(1.04,.9)}
  30%{transform:translateY(-42px) rotate(-120deg) scale(.95,1.06)}
  55%{transform:translateY(-56px) rotate(-240deg) scale(.95,1.04)}
  80%{transform:translateY(-10px) rotate(-338deg) scale(1,1)}
  92%{transform:translateY(4px) rotate(-360deg) scale(1.06,.88)}
  100%{transform:translateY(0) rotate(-360deg) scale(1)}
}
@keyframes iz-flip-hair{
  0%{transform:rotate(0)}22%{transform:rotate(16deg)}52%{transform:rotate(-14deg)}
  78%{transform:rotate(9deg)}100%{transform:rotate(0)}
}
@keyframes iz-flip-legL{0%,100%{transform:rotate(0)}30%{transform:rotate(-38deg)}60%{transform:rotate(22deg)}}
@keyframes iz-flip-legR{0%,100%{transform:rotate(0)}30%{transform:rotate(-20deg)}60%{transform:rotate(34deg)}}
@keyframes iz-flip-armL{0%,100%{transform:rotate(0)}25%{transform:rotate(-52deg)}70%{transform:rotate(18deg)}}
@keyframes iz-flip-armR{0%,100%{transform:rotate(0)}25%{transform:rotate(52deg)}70%{transform:rotate(-18deg)}}
@keyframes iz-flip-shadow{0%,100%{transform:scaleX(1);opacity:1}45%{transform:scaleX(.45);opacity:.35}}

/* RUN IN PLACE: legs alternate, arms counter-pump, body bobs on the double. */
.izzy[data-act=run] .figure{animation:iz-run-body .34s ease-in-out infinite}
.izzy[data-act=run] .legL{animation:iz-run-legL .68s ease-in-out infinite}
.izzy[data-act=run] .legR{animation:iz-run-legR .68s ease-in-out infinite}
.izzy[data-act=run] .armL{animation:iz-run-armL .68s ease-in-out infinite}
.izzy[data-act=run] .armR{animation:iz-run-armR .68s ease-in-out infinite}
.izzy[data-act=run] .hairBack{animation:iz-run-hair .68s ease-in-out infinite}
@keyframes iz-run-body{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes iz-run-legL{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}}
@keyframes iz-run-legR{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
@keyframes iz-run-armL{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(26deg)}}
@keyframes iz-run-armR{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-26deg)}}
@keyframes iz-run-hair{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* WAVE: one arm only, with a small lean toward the viewer. */
.izzy[data-act=wave] .armR{animation:iz-wave 1.5s ease-in-out}
.izzy[data-act=wave] .figure{animation:iz-wave-lean 1.5s ease-in-out}
.izzy[data-act=wave] .head{animation:iz-wave-head 1.5s ease-in-out}
@keyframes iz-wave{
  0%{transform:rotate(0)}18%{transform:rotate(-118deg)}
  34%{transform:rotate(-96deg)}50%{transform:rotate(-126deg)}
  66%{transform:rotate(-98deg)}82%{transform:rotate(-120deg)}100%{transform:rotate(0)}
}
@keyframes iz-wave-lean{0%,100%{transform:rotate(0)}40%{transform:rotate(3deg)}}
@keyframes iz-wave-head{0%,100%{transform:rotate(0)}40%{transform:rotate(5deg)}}

/* HOP: small two-beat bounce with squash and stretch. */
.izzy[data-act=hop] .stage{animation:iz-hop .78s cubic-bezier(.3,.05,.25,1)}
.izzy[data-act=hop] .hairBack{animation:iz-hop-hair .78s ease-in-out}
.izzy[data-act=hop] .shadow{animation:iz-hop-shadow .78s ease-in-out}
@keyframes iz-hop{
  0%,100%{transform:translateY(0) scale(1)}
  14%{transform:translateY(3px) scale(1.06,.9)}
  46%{transform:translateY(-22px) scale(.96,1.07)}
  78%{transform:translateY(2px) scale(1.05,.93)}
}
@keyframes iz-hop-hair{0%,100%{transform:rotate(0)}40%{transform:rotate(-9deg)}70%{transform:rotate(5deg)}}
@keyframes iz-hop-shadow{0%,100%{transform:scaleX(1);opacity:1}46%{transform:scaleX(.7);opacity:.55}}

/* SPIN: a flat pirouette. scaleX through zero reads as turning, and the veil
   never opens because the whole head turns as one piece. */
.izzy[data-act=spin] .figure{animation:iz-spin 1s ease-in-out}
.izzy[data-act=spin] .hairBack{animation:iz-spin-hair 1s ease-in-out}
@keyframes iz-spin{
  0%,100%{transform:scaleX(1)}
  25%{transform:scaleX(.15)}50%{transform:scaleX(-1)}75%{transform:scaleX(.15)}
}
@keyframes iz-spin-hair{0%,100%{transform:rotate(0)}30%{transform:rotate(11deg)}70%{transform:rotate(-11deg)}}

/* SWAY: the smallest one, a weight shift. */
.izzy[data-act=sway] .figure{animation:iz-sway 2.1s ease-in-out}
@keyframes iz-sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}

/* NOD: acknowledges without a big gesture. */
.izzy[data-act=nod] .head{animation:iz-nod 1.1s ease-in-out}
@keyframes iz-nod{0%,100%{transform:rotate(0)}30%{transform:rotate(7deg) translateY(2px)}65%{transform:rotate(-2deg)}}

@media (prefers-reduced-motion:reduce){
  .izzy *{animation:none !important}
  .izzy .mouthSmile,.izzy .mouthRest,.izzy .blush{transition:none}
}
`;

/* Izzy's behaviour: idle life, random playful actions, and a state machine that
   answers to app events. She reacts to the STATE OF THE PROCESS, never to a person. */
function makeIzzy(node){
  node.classList.add("izzy");
  node.innerHTML = IZZY_SVG;
  if(!document.getElementById("izzy-style")){
    var st=document.createElement("style");
    st.id="izzy-style"; st.textContent=IZZY_CSS;
    document.head.appendChild(st);
  }

  var DUR={backflip:1150,run:2400,wave:1500,hop:780,spin:1000,sway:2100,nod:1100};
  /* Playful actions are gated by state. She never does a backflip while the group
     is stuck, and never celebrates an option someone just ruled out. */
  var BY_STATE={
    lost:      ["sway","nod"],
    anchor:    ["sway","nod","wave","hop","run"],
    empowered: ["hop","backflip","spin","wave","run","sway"]
  };
  var SMILE={backflip:1,hop:1,spin:1,wave:1,run:1,sway:0,nod:0};

  var state="lost", busy=false, last="", timer=null, reduce=false;
  try{ reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

  function play(act){
    if(busy || reduce || node.classList.contains("hidden")) return false;
    busy=true; last=act;
    node.setAttribute("data-act",act);
    if(SMILE[act]) node.setAttribute("data-smile","1");
    setTimeout(function(){
      node.removeAttribute("data-act");
      /* she keeps the smile a moment after the move, then settles */
      setTimeout(function(){
        if(state!=="empowered") node.removeAttribute("data-smile");
      }, 900);
      busy=false;
    }, DUR[act]||1000);
    return true;
  }

  /* Random idle actions. Irregular gaps, never the same twice running, and only
     about two thirds of the time so the rhythm stays unpredictable. */
  function schedule(){
    clearTimeout(timer);
    var wait = 7000 + Math.random()*13000;
    timer=setTimeout(function(){
      var pool=(BY_STATE[state]||[]).filter(function(a){return a!==last;});
      if(pool.length && Math.random()<0.68) play(pool[Math.floor(Math.random()*pool.length)]);
      schedule();
    }, wait);
  }
  schedule();

  return {
    node:node,
    /* app events set the semantic state; a fitting reaction fires once */
    set:function(next, react){
      if(next && next!==state){
        state=next;
        node.setAttribute("data-state",state);
        if(state==="empowered"){ node.setAttribute("data-smile","1"); setTimeout(function(){play("backflip");},260); }
        else if(state==="anchor"){ setTimeout(function(){play("nod");},300); }
        else { node.removeAttribute("data-smile"); }
      }
      if(react) setTimeout(function(){play(react);},220);
    },
    play:play,
    hide:function(on){ node.classList.toggle("hidden",on); }
  };
};

var IZ = makeIzzy($("izzy"));

/* -- beats ------------------------------------------- */
function $(i){return document.getElementById(i);}
var cur=-1, auto=true, izzyEl=$("izzy");

function setReact(r,ms){ if(r&&r!=="none") IZ.play(r); }

function render(n){
  var prevN=cur; cur=n; var s=STEPS[n];

  $("beatKey").innerHTML=s.k+" <s>/</s> "+s.t;
  $("beatLine").textContent=s.l;
  $("titleTail").textContent=s.tail;
  $("izzyStatus").textContent=s.sx;
  Array.prototype.forEach.call(ticks.children,function(d,i){d.className=i<n?"done":(i===n?"now":"");});
  $("prev").disabled=(n===0);
  $("next").textContent=(n===STEPS.length-1)?"replay":"next";

  /* Izzy: app events drive semantic state; reactions are transient, then return. */
  IZ.set(s.st);
  if(n!==prevN){
    if(n===5) setReact("nod");
    else if(n===6) setReact("wave");
    else if(n===7) setReact("backflip");
  }

  /* rack */
  PEOPLE.forEach(function(p){
    var f=$("f-"+p.id);
    f.classList.toggle("on", n>=1);
    var kills=OPTS.filter(function(o){
      return o.kills.filter(function(k){return k[0]===p.id;}).length>0;
    }).length;
    var stt="";
    if(n>=6&&p.cost>0) stt="flexed +3";
    else if(n>=6) stt="held";
    else if(n>=3&&kills>0) stt="ruled out "+kills;
    else if(n>=2) stt=p.kind;
    $("st-"+p.id).textContent=stt;
    f.classList.toggle("killer", n>=3&&n<6&&kills>0);
    f.classList.toggle("flexed", n>=6&&p.cost>0);
    $("sig-"+p.id).classList.toggle("in", n>=7);
    if(p.slider){
      var v=(n>=6)?p.slider.to:p.slider.from;
      var pct=(v-p.slider.min)/(p.slider.max-p.slider.min)*100;
      $("fil-"+p.id).style.width=pct.toFixed(1)+"%";
      $("num-"+p.id).textContent=v;
      $("sl-"+p.id).classList.toggle("gold", n>=6);
      $("lim-"+p.id).textContent=(n>=6)?(LE+" 20"):(LE+" 15");
      $("lim-"+p.id).classList.toggle("gold", n>=6);
    }
  });
  $("guiCount").textContent = n<1?"waiting":(n<2?"reading":(n>=6?"1 flexed":"4 hard, 1 soft"));

  $("gui").style.display = n>=6 ? "none":"block";
  $("verd").classList.toggle("on", n>=6);
  $("flexCard").classList.toggle("on", n===5);

  /* scene */
  bloomTarget = n>=2?1:0;
  signTarget  = n>=7?1:0;
  dimTarget   = n===4?1:0;
  focusTarget = n===4?1:0;
  aliveIdx    = n>=6?3:-1;
  for(var i=0;i<4;i++) fallTarget[i] = (n>=3 && !(n>=6 && i===3)) ? 1 : 0;

  var surv = n<3?4:(n<6?0:1);
  $("statLine").textContent="SURVIVORS "+surv+"/4";
  $("statLine").style.color = surv===0?"#E23A54":(surv===1?"#7FAE8C":"#8A7A9B");
  pushStat(surv);
}

$("flexBody").innerHTML='<b>Jess</b>, could you do a <b>20 minute</b> walk instead of 15? '+
  'It is the only change that reopens anything, and it unlocks <b>Taqueria Luz</b> at 18. '+
  'Nobody else is being asked to move.';
$("vName").textContent=WIN.n;
$("vMeta").textContent=WIN.m+DOT+"open till 11";
$("vWorst").innerHTML='Worst off: <b>Jess</b>, by 3 minutes. Every surviving alternative had someone worse off than that.';

$("next").addEventListener("click",function(){auto=false;render(cur>=STEPS.length-1?0:cur+1);});
window.addEventListener("hashchange",function(){var n=startStep(); if(n>=0){auto=false;render(n);settle();}});
$("prev").addEventListener("click",function(){auto=false;render(Math.max(0,cur-1));});
$("flexYes").addEventListener("click",function(){auto=false;render(6);});
$("flexNo").addEventListener("click",function(){
  auto=false;
  $("flexBody").innerHTML='<b>Jess</b> said no, and that is a legitimate answer. '+
    'Her limit goes back in as fixed, and the group re-runs against a wider option set. '+
    'Nobody is asked twice.';
  $("flexYes").textContent="re-run with jess held"; $("flexNo").style.display="none";
});
$("hideIzzy").addEventListener("click",function(){
  var h=izzyEl.classList.toggle("hidden");
  this.textContent=h?"show izzy":"hide izzy";
});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){auto=false;render(Math.min(STEPS.length-1,cur+1));}
  if(e.key==="ArrowLeft"){auto=false;render(Math.max(0,cur-1));}
});

/* settle(): snap all eased values so a deep-linked step renders finished */
function settle(){
  for(var i=0;i<4;i++) fallAmt[i]=fallTarget[i];
  bloomOpen=bloomTarget; signAmt=signTarget; dimAmt=dimTarget; focusJess=focusTarget;
}
/* ?step=N or #N deep-links a beat and stops autoplay: shareable, and deterministic
   for screenshots. Out-of-range values fall back to the normal autoplay run. */
function startStep(){
  var m=/[?&]step=(\d+)/.exec(location.search) || /^#(\d+)$/.exec(location.hash);
  if(!m) return -1;
  var n=parseInt(m[1],10);
  return (n>=0 && n<STEPS.length) ? n : -1;
}

resize();
var deep=startStep();
render(deep>=0?deep:0);
if(deep>=0){ auto=false; settle(); }
frame();
if(deep<0 && !matchMedia("(prefers-reduced-motion: reduce)").matches){
  var HOLD=[2600,3800,3400,5200,3600,4000,4400,3400];
  (function tick(){
    if(!auto)return;
    setTimeout(function(){
      if(!auto)return;
      if(cur<STEPS.length-1){render(cur+1);tick();} else auto=false;
    },HOLD[cur]);
  })();
}
</script>
