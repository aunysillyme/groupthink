<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,300..600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#08050D;font-family:"JetBrains Mono",monospace;color:#E8DFD0;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 40%,#1E1230 0%,#0D0814 58%,#08050D 100%)}
svg.grid{position:absolute;inset:0}
.wm{position:absolute;left:64px;top:56px}
.wm h1{font-family:"JetBrains Mono";font-size:52px;font-weight:700;letter-spacing:-.02em;color:#E23A54}
.wm h1 span{color:#E8DFD0}
.wm .tag{font-family:Fraunces,serif;font-size:38px;color:#E8DFD0;margin-top:14px;line-height:1.15;font-weight:400}
.wm .sub{font-size:15px;color:#8A7A9B;margin-top:16px;line-height:1.7;max-width:520px}
.wm .sub b{color:#E8DFD0;font-weight:500}
.chip{position:absolute;left:64px;bottom:52px;display:flex;gap:9px}
.chip span{border:1px solid #3D2C4A;padding:6px 13px;font-size:12px;letter-spacing:.1em;color:#8A7A9B}
.chip span.hot{border-color:#E23A54;color:#E23A54}
.kill{position:absolute;background:#2A0F19;border:1px solid #8E1F3D;color:#F0A8B4;font-size:14px;padding:6px 12px;white-space:nowrap}
</style>
<div class="bg"></div>
<svg class="grid" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="p0"><stop offset="0" stop-color="#A886C4" stop-opacity=".95"/><stop offset="1" stop-color="#A886C4" stop-opacity="0"/></radialGradient>

    <circle cx="806" cy="232" r="46" fill="url(#p0)"/><circle cx="806" cy="232" r="9" fill="#2B1A22"/>

    <circle r="22" fill="#1F1429" stroke="#3A2A44" stroke-width="2"/><circle r="7" fill="#4A3550"/>

<div class="wm">

  <div class="tag">Nobody gets<br>outvoted.</div>
